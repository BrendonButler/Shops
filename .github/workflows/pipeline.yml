name: CI Pipeline

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_call:
    inputs:
      create_release_artifacts:
        description: 'Called from the release workflow'
        required: false
        type: boolean
        default: false
      revision:
        description: 'Version to build (the release tag). Empty builds the POM version, for example 0.4.0-SNAPSHOT'
        required: false
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.create_release_artifacts }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # JDK 25 builds Java 21 bytecode through maven.compiler.release (D2)
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Build and test
        env:
          REVISION: ${{ inputs.revision }}
        run: mvn -B verify ${REVISION:+"-Drevision=$REVISION"}

      - name: Upload coverage to Codecov
        if: ${{ !inputs.create_release_artifacts }}
        uses: codecov/codecov-action@v7
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            */target/shops-*.jar
            !*/target/original-*.jar
          retention-days: 1

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ !inputs.create_release_artifacts }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'
      - name: Check Javadoc / site
        run: mvn -B -DskipTests package site

  # Compiles against the 26.x API and runs every test on the 26.x mock server (D1/D3). Never released.
  mc26-compat:
    name: 26.x Compatibility
    runs-on: ubuntu-latest
    if: ${{ !inputs.create_release_artifacts }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'
      - name: Build and test against 26.x
        run: mvn -B -Pmc26 verify

  # Compiles the plugin against the Spigot API to catch Paper-only calls (D1). Main code only.
  spigot-api:
    name: Spigot API Compile
    runs-on: ubuntu-latest
    if: ${{ !inputs.create_release_artifacts }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'
      - name: Compile against spigot-api
        run: mvn -B -Pspigot-api -pl spigot -am compile

  report:
    name: Report
    if: ${{ always() && !inputs.create_release_artifacts }}
    needs: [build-and-test, documentation, mc26-compat, spigot-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      OVERALL: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || (needs.build-and-test.result == 'success' && needs.documentation.result == 'success' && needs.mc26-compat.result == 'success' && needs.spigot-api.result == 'success') && 'success' || 'failure' }}
    steps:
      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ env.OVERALL }}
          title: ${{ env.OVERALL == 'success' && 'Shops build succeeded' || env.OVERALL == 'cancelled' && 'Shops build cancelled' || 'Shops build failed' }}
          description: |
            **Branch:** ${{ github.head_ref || github.ref_name }}
            ${{ github.event_name == 'pull_request' && format('**PR:** #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}
            Build & tests: `${{ needs.build-and-test.result }}`
            Docs: `${{ needs.documentation.result }}`
            26.x compatibility: `${{ needs.mc26-compat.result }}`
            Spigot API compile: `${{ needs.spigot-api.result }}`
          url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          nodetail: true
