name: CI Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      create_release_artifacts:
        description: 'Called from the release workflow'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.create_release_artifacts }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Upload coverage to Codecov
        if: ${{ !inputs.create_release_artifacts }}
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            */target/shops-*.jar
            !*/target/original-*.jar
          retention-days: 1

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ !inputs.create_release_artifacts }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'
      - name: Check Javadoc / site
        run: mvn -B validate site -DskipTests -Dmaven.main.skip -Dmaven.test.skip

  report:
    name: Report
    if: ${{ always() && !inputs.create_release_artifacts }}
    needs: [build-and-test, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      OVERALL: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || (needs.build-and-test.result == 'success' && needs.documentation.result == 'success') && 'success' || 'failure' }}
    steps:
      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ env.OVERALL }}
          title: ${{ env.OVERALL == 'success' && 'Shops build succeeded' || env.OVERALL == 'cancelled' && 'Shops build cancelled' || 'Shops build failed' }}
          description: |
            **Branch:** ${{ github.head_ref || github.ref_name }}
            ${{ github.event_name == 'pull_request' && format('**PR:** #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}
            Build & tests: `${{ needs.build-and-test.result }}`
            Docs: `${{ needs.documentation.result }}`
          url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          nodetail: true
