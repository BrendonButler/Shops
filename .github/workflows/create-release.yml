name: Create and Publish Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  pipeline:
    name: Build and Test
    uses: ./.github/workflows/pipeline.yml
    with:
      create_release_artifacts: true
      revision: ${{ github.ref_name }}
    secrets: inherit

  create-and-publish-release:
    name: Create and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pipeline
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: artifacts

      - name: Check tag and determine release type
        id: release-type
        run: |
          # Tags are SemVer with no "v" prefix and an optional alpha.N, beta.N or rc.N label: 0.4.0, 0.4.0-beta.1,
          # 1.0.0-rc.1. Numbers have no leading zeroes, as SemVer requires.
          NUM='(0|[1-9][0-9]*)'
          SEMVER="^$NUM\.$NUM\.$NUM(-(alpha|beta|rc)\.$NUM)?\$"
          if ! [[ $TAG =~ $SEMVER ]]; then
            echo "::error::Tag $TAG isn't a version like 0.4.0, 0.4.0-alpha.1, 0.4.0-beta.1 or 0.4.0-rc.1 (lowercase, no 'v' prefix, no leading zeroes)"
            exit 1
          fi

          CORE="${TAG%%-*}"
          LABEL=""
          [[ $TAG == *-* ]] && LABEL="${TAG#*-}"

          # The tag can be older than the POM (a patch from older code) but never newer
          POM_REVISION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)
          POM_BASE="${POM_REVISION%%-*}"
          if [ "$(printf '%s\n%s\n' "$CORE" "$POM_BASE" | sort -V | tail -n1)" != "$POM_BASE" ]; then
            echo "::error::Tag $TAG is newer than the version in progress ($POM_REVISION). Update <revision> in pom.xml first."
            exit 1
          fi

          # The SemVer check above already limits the label to alpha.N, beta.N or rc.N
          case "$LABEL" in
            "")       STAGE=release; LABEL_NAME="" ;;
            alpha.*)  STAGE=alpha;   LABEL_NAME="Alpha" ;;
            beta.*)   STAGE=beta;    LABEL_NAME="Beta" ;;
            # CurseForge has no release candidate type, so RCs publish as beta
            rc.*)     STAGE=beta;    LABEL_NAME="Release Candidate" ;;
          esac

          # Only the highest published full release becomes "Latest", so a patch to an older line doesn't replace
          # it. Published releases are used rather than tags, so a tag whose release failed doesn't count.
          LATEST=false
          if [ "$STAGE" = release ]; then
            HIGHEST=$( { gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName'; echo "$TAG"; } \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            [ "$HIGHEST" = "$TAG" ] && LATEST=true
          fi

          if [ "$STAGE" = release ]; then
            TITLE="Shops $TAG"
            ANNOUNCE_TITLE="Shops $TAG released!"
            ANNOUNCE_TEXT="A new version has been released! 🎉"
          else
            TITLE="Shops $TAG ($LABEL_NAME)"
            ANNOUNCE_TITLE="Shops $TAG ($LABEL_NAME) is available for testing"
            ANNOUNCE_TEXT="A new test build is available. It isn't a full release yet, so please try it on a test server first and report any issues."
          fi

          echo "Tag $TAG: stage=$STAGE, latest=$LATEST, POM version in progress=$POM_REVISION"
          {
            echo "release_stage=$STAGE"
            echo "latest=$LATEST"
            echo "title=$TITLE"
            echo "announce_title=$ANNOUNCE_TITLE"
            echo "announce_text=$ANNOUNCE_TEXT"
          } >> "$GITHUB_OUTPUT"

      - name: Locate and verify Spigot JAR
        id: prepare-jars
        run: |
          # Sponge is intentionally excluded from releases while it is on hold
          SPIGOT_JAR=$(find artifacts -type f -name "shops-spigot-${TAG}.jar" | head -n 1)
          if [ -z "$SPIGOT_JAR" ]; then
            echo "::error::shops-spigot-${TAG}.jar not found in build artifacts"
            find artifacts -type f
            exit 1
          fi

          SIZE=$(stat -c%s "$SPIGOT_JAR")
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::$SPIGOT_JAR seems too small ($SIZE bytes)"
            exit 1
          fi

          if ! unzip -l "$SPIGOT_JAR" plugin.yml > /dev/null; then
            echo "::error::$SPIGOT_JAR is not a valid JAR or is missing plugin.yml"
            exit 1
          fi

          if ! unzip -p "$SPIGOT_JAR" plugin.yml | grep -qx "version: ${TAG}"; then
            echo "::error::plugin.yml version does not match tag ($TAG)"
            unzip -p "$SPIGOT_JAR" plugin.yml | grep '^version:'
            exit 1
          fi

          echo "✅ $SPIGOT_JAR verified ($SIZE bytes, plugin.yml version $TAG)"
          echo "spigot_jar=$SPIGOT_JAR" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Previous tag reachable from this one (not just the highest version number)
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Using all commits for changelog."
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges "$TAG")
          else
            echo "Generating changelog from $PREV_TAG to $TAG"
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges "$PREV_TAG..$TAG")
          fi

          echo "$CHANGELOG" > changelog.md

          DELIM=$(openssl rand -hex 8)
          {
            echo "changelog<<$DELIM"
            echo "$CHANGELOG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          SPIGOT_JAR: ${{ steps.prepare-jars.outputs.spigot_jar }}
          STAGE: ${{ steps.release-type.outputs.release_stage }}
          LATEST: ${{ steps.release-type.outputs.latest }}
          TITLE: ${{ steps.release-type.outputs.title }}
        run: |
          PRERELEASE=false
          [ "$STAGE" != "release" ] && PRERELEASE=true

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes and uploading artifacts"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file changelog.md \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
            gh release upload "$TAG" "$SPIGOT_JAR" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "$SPIGOT_JAR" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file changelog.md \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
          fi

      - name: Verify release artifacts on GitHub
        env:
          SPIGOT_JAR: ${{ steps.prepare-jars.outputs.spigot_jar }}
        run: |
          EXPECTED=$(basename "$SPIGOT_JAR")
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$EXPECTED"; then
            echo "✅ $EXPECTED found in GitHub release $TAG"
          else
            echo "::error::$EXPECTED not found in GitHub release $TAG"
            exit 1
          fi

      - name: Upload Spigot artifact to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: '873479'
          JAR: ${{ steps.prepare-jars.outputs.spigot_jar }}
          RELEASE_TYPE: ${{ steps.release-type.outputs.release_stage }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          # Bukkit version IDs (type 1) from https://dev.bukkit.org/api/game/versions:
          # 14417 = 1.21.11, 16083 = 26.1, 16084 = 26.1.1, 16085 = 26.1.2, 16500 = 26.2, 17046 = 26.3.
          # Bukkit projects don't accept the Java version group. CI builds against 1.21.11 and tests against 26.3 (D3).
          GAME_VERSIONS: '14417,16083,16084,16085,16500,17046'
        run: |
          METADATA=$(jq -n \
            --arg displayName "Shops $TAG" \
            --arg releaseType "$RELEASE_TYPE" \
            --arg changelog "$CHANGELOG" \
            --arg gameVersions "$GAME_VERSIONS" \
            '{
              displayName: $displayName,
              releaseType: $releaseType,
              changelog: $changelog,
              changelogType: "markdown",
              gameVersions: ($gameVersions | split(",") | map(tonumber)),
              relations: {projects: [
                {slug: "vault", type: "requiredDependency"},
                {slug: "essentialsx", type: "optionalDependency"}
              ]}
            }')

          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$METADATA;type=application/json" \
            -F "file=@$JAR" \
            "https://bukkit.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")

          if [ "$HTTP_CODE" != 200 ]; then
            echo "::error::CurseForge upload failed with HTTP $HTTP_CODE: $(cat response.json)"
            exit 1
          fi
          echo "Uploaded to CurseForge as file $(jq -r .id response.json)"

      - name: Send Discord notification
        if: ${{ always() && env.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          title: ${{ job.status == 'success' && steps.release-type.outputs.announce_title || format('Shops {0} release failed!', github.ref_name) }}
          description: |
            **Type:** ${{ steps.release-type.outputs.release_stage }}

            ${{ job.status == 'success' && steps.release-type.outputs.announce_text || 'Release process failed. Please check the workflow run for details.' }}
            ${{ job.status == 'success' && format('See the changes at: https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || '' }}
          color: ${{ job.status == 'success' && '5025616' || '15548997' }}
          url: ${{ job.status == 'success' && format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          nodetail: true
