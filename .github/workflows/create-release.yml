name: Create and Publish Release

on:
  push:
    tags:
      - '*'

jobs:
  pipeline:
    name: Build and Test
    uses: ./.github/workflows/pipeline.yml
    with:
      create_release_artifacts: true
    secrets: inherit

  create-and-publish-release:
    name: Create and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pipeline
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: artifacts

      - name: Verify POM version matches tag
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_VERSION" != "$TAG" ]; then
            echo "::error::POM version ($POM_VERSION) does not match Git tag ($TAG)"
            exit 1
          fi
          echo "✅ POM version matches Git tag: $TAG"

      - name: Locate and verify Spigot JAR
        id: prepare-jars
        run: |
          # Sponge is intentionally excluded from releases while it is on hold
          SPIGOT_JAR=$(find artifacts -type f -name "shops-spigot-${TAG}.jar" | head -n 1)
          if [ -z "$SPIGOT_JAR" ]; then
            echo "::error::shops-spigot-${TAG}.jar not found in build artifacts"
            find artifacts -type f
            exit 1
          fi

          SIZE=$(stat -c%s "$SPIGOT_JAR")
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::$SPIGOT_JAR seems too small ($SIZE bytes)"
            exit 1
          fi

          if ! unzip -l "$SPIGOT_JAR" plugin.yml > /dev/null; then
            echo "::error::$SPIGOT_JAR is not a valid JAR or is missing plugin.yml"
            exit 1
          fi

          if ! unzip -p "$SPIGOT_JAR" plugin.yml | grep -qx "version: ${TAG}"; then
            echo "::error::plugin.yml version does not match tag ($TAG)"
            unzip -p "$SPIGOT_JAR" plugin.yml | grep '^version:'
            exit 1
          fi

          echo "✅ $SPIGOT_JAR verified ($SIZE bytes, plugin.yml version $TAG)"
          echo "spigot_jar=$SPIGOT_JAR" >> "$GITHUB_OUTPUT"

      - name: Determine release stage
        id: release-stage
        run: |
          LOWER_TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          if [[ $LOWER_TAG == *beta* ]]; then
            STAGE=beta
          elif [[ $LOWER_TAG == *alpha* ]]; then
            STAGE=alpha
          else
            STAGE=release
          fi
          echo "Release stage: $STAGE"
          echo "release_stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Previous tag reachable from this one (not just the highest version number)
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Using all commits for changelog."
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges "$TAG")
          else
            echo "Generating changelog from $PREV_TAG to $TAG"
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges "$PREV_TAG..$TAG")
          fi

          echo "$CHANGELOG" > changelog.md

          DELIM=$(openssl rand -hex 8)
          {
            echo "changelog<<$DELIM"
            echo "$CHANGELOG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          SPIGOT_JAR: ${{ steps.prepare-jars.outputs.spigot_jar }}
          STAGE: ${{ steps.release-stage.outputs.release_stage }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading artifacts"
            gh release upload "$TAG" "$SPIGOT_JAR" --clobber
          else
            echo "Creating release $TAG"
            PRERELEASE=""
            [ "$STAGE" != "release" ] && PRERELEASE="--prerelease"
            gh release create "$TAG" "$SPIGOT_JAR" \
              --verify-tag \
              --title "Shops $TAG" \
              --notes-file changelog.md \
              $PRERELEASE
          fi

      - name: Verify release artifacts on GitHub
        env:
          SPIGOT_JAR: ${{ steps.prepare-jars.outputs.spigot_jar }}
        run: |
          EXPECTED=$(basename "$SPIGOT_JAR")
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$EXPECTED"; then
            echo "✅ $EXPECTED found in GitHub release $TAG"
          else
            echo "::error::$EXPECTED not found in GitHub release $TAG"
            exit 1
          fi

      - name: Upload Spigot artifact to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          file_path: ${{ steps.prepare-jars.outputs.spigot_jar }}
          game_endpoint: bukkit
          relations: vault:requiredDependency,essentialsx:optionalDependency
          game_versions: 'Minecraft 1.20:1.20.4,Java 21'
          release_type: ${{ steps.release-stage.outputs.release_stage }}
          display_name: Shops ${{ github.ref_name }}
          changelog: ${{ steps.changelog.outputs.changelog }}
          changelog_type: markdown
          project_id: 873479
          token: ${{ secrets.CF_API_TOKEN }}

      - name: Send Discord notification
        if: ${{ always() && env.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          title: ${{ job.status == 'success' && format('Shops version {0} released!', github.ref_name) || format('Shops version release {0} failed!', github.ref_name) }}
          description: |
            **Type:** ${{ steps.release-stage.outputs.release_stage }}

            ${{ job.status == 'success' && 'A new version has been released! 🎉' || 'Release process failed. Please check the workflow run for details.' }}
            ${{ job.status == 'success' && format('See the changes at: https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || '' }}
          color: ${{ job.status == 'success' && '5025616' || '15548997' }}
          url: ${{ job.status == 'success' && format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          nodetail: true
